name: Onyx
options:
  bundleIdPrefix: org.kennethreitz
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "15.3"
  generateEmptyDirectories: false
packages:
  Onyx:
    path: .
targets:
  OnyxMobile:
    type: application
    platform: iOS
    deploymentTarget: "17.0"
    sources:
      - path: Sources/OnyxMobile
      - path: Resources/web
        type: folder
        buildPhase: resources
      - path: Resources/fonts
        type: folder
        buildPhase: resources
      - path: Resources/iOS/Assets.xcassets
    dependencies:
      - package: Onyx
        product: OnyxCore
      - package: Onyx
        product: OnyxSync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: org.kennethreitz.onyx.ios
        PRODUCT_NAME: Onyx
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        MARKETING_VERSION: "0.1.15"
        CURRENT_PROJECT_VERSION: "1"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Onyx
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.productivity
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight
        INFOPLIST_KEY_LSSupportsOpeningDocumentsInPlace: YES
        INFOPLIST_KEY_UISupportsDocumentBrowser: NO
        INFOPLIST_KEY_UIFileSharingEnabled: NO
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        SUPPORTS_MACCATALYST: NO
        SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD: NO

schemes:
  OnyxMobile:
    build:
      targets:
        OnyxMobile: all
    run:
      config: Debug
